<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Viculus — Artificial Social Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top: #ffffff;
    --bg-bot: #f8f9fb;
    --ink: #202020;
    --ink-soft: #6b6f76;
    --ink-faint: #a6a9b0;
    --line: #ecedf0;
    --card: #ffffff;
    --accent: #4f46e5;
    --accent-soft: #eef0fd;
    --pos: #1fa971;
    --pos-soft: #e6f6ee;
    --neg: #e5484d;
    --neg-soft: #fdecee;
    --radius: 18px;
    --shadow: 0 6px 30px rgba(0,0,0,0.06);
    --shadow-lift: 0 10px 34px rgba(79,70,229,0.14);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bot) 60%);
    min-height:100vh;
    color: var(--ink);
    font-family:'Inter', -apple-system, system-ui, sans-serif;
    padding: 32px clamp(20px, 4vw, 56px) 60px;
  }

  .mono{ font-family:'JetBrains Mono', monospace; }

  /* ---------------- header ---------------- */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom: 28px;
    flex-wrap:wrap;
    gap:16px;
  }
  .brand h1{
    margin:0;
    font-size: 26px;
    font-weight:800;
    letter-spacing: 0.16em;
  }
  .brand p{
    margin: 6px 0 0;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .status{
    display:flex;
    align-items:center;
    gap: 18px;
  }
  .status .pill{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--card);
    border-radius: 999px;
    padding: 8px 16px;
    box-shadow: var(--shadow);
    font-size: 12px;
    color: var(--ink-soft);
  }
  .status .pill .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--pos);
    box-shadow: 0 0 0 4px var(--pos-soft);
    animation: livepulse 2s ease-in-out infinite;
  }
  @keyframes livepulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.3); opacity:.7; }
  }
  .status .tick{
    font-size: 13px;
    color: var(--ink);
    font-weight:600;
  }
  .status .tick span{ color: var(--accent); }

  /* ---------------- hero: network ---------------- */
  .stage{
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 8px;
    margin-bottom: 24px;
    position:relative;
    overflow:hidden;
  }
  .stage-label{
    position:absolute;
    top: 20px; left: 26px;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color: var(--ink-faint);
    z-index:2;
  }
  .stage svg{ display:block; width:100%; height:auto; }

  .node-label{
    font-size: 13px;
    font-weight:600;
    fill: var(--ink);
    font-family:'Inter', sans-serif;
  }
  .node-role{
    font-size: 9.5px;
    fill: var(--ink-faint);
    font-family:'JetBrains Mono', monospace;
    letter-spacing:0.04em;
  }
  circle.node{
    stroke-width: 2;
    transition: r .4s ease, filter .4s ease;
  }
  circle.node.active{
    filter: drop-shadow(0 0 12px rgba(79,70,229,0.55));
  }
  circle.ring{
    fill:none;
    stroke: var(--accent);
    opacity:0;
    transform-origin: center;
  }
  circle.ring.pulse{
    animation: ringpulse 1.6s ease-out;
  }
  @keyframes ringpulse{
    0%{ opacity:.55; stroke-width:2; }
    100%{ opacity:0; stroke-width:0; transform: scale(1.6); }
  }
  line.edge{
    transition: stroke .6s ease, stroke-width .6s ease, opacity .6s ease;
    stroke-linecap: round;
  }

  /* ---------------- grid: cards + feed ---------------- */
  .grid{
    display:grid;
    grid-template-columns: minmax(0,1fr) 300px;
    gap: 24px;
    align-items:start;
  }
  @media (max-width: 980px){
    .grid{ grid-template-columns: 1fr; }
  }

  .cards{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 16px;
  }

  .card{
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 18px 16px;
    transition: box-shadow .35s ease, transform .35s ease;
  }
  .card.active{
    box-shadow: var(--shadow-lift);
    transform: translateY(-2px);
  }
  .card-top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 10px;
  }
  .avatar{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; color:#fff;
    flex-shrink:0;
  }
  .card-name{ font-size:14.5px; font-weight:700; line-height:1.1; }
  .card-role{
    font-size:10.5px; color: var(--ink-faint);
    text-transform:uppercase; letter-spacing:0.06em;
    margin-top:2px;
  }

  .goal-row{
    font-size:12px;
    color: var(--ink-soft);
    margin-bottom: 12px;
    display:flex;
    gap:6px;
  }
  .goal-row b{ color:var(--ink); font-weight:600; }

  .stat{ margin-bottom: 9px; }
  .stat-head{
    display:flex; justify-content:space-between;
    font-size:11px; color:var(--ink-soft);
    margin-bottom:4px;
  }
  .stat-head .val{ font-family:'JetBrains Mono',monospace; color:var(--ink); }
  .bar-track{
    height:5px; border-radius:3px;
    background: var(--line);
    overflow:hidden;
  }
  .bar-fill{
    height:100%; border-radius:3px;
    transition: width .6s ease;
  }
  .bar-fill.energy{ background: var(--accent); }
  .bar-fill.belonging{ background: #ff8a5c; }
  .bar-fill.reputation{ background: var(--pos); }

  .action{
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size:12px;
  }
  .action .label{
    color: var(--ink-faint);
    font-size:10px; text-transform:uppercase; letter-spacing:0.06em;
    margin-bottom:3px;
  }
  .action .value{ color: var(--ink); font-weight:500; }

  .memory{
    margin-top:10px;
    font-size:12px;
    font-style:italic;
    color: var(--ink-soft);
    padding-left:10px;
    border-left: 2px solid var(--accent-soft);
  }

  /* ---------------- event feed ---------------- */
  .feed{
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 18px 8px;
    max-height: 560px;
    display:flex;
    flex-direction:column;
  }
  .feed h3{
    margin:0 0 4px;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color: var(--ink-faint);
  }
  .feed-list{
    overflow-y:auto;
    margin-top:8px;
    flex:1;
  }
  .feed-list::-webkit-scrollbar{ width:4px; }
  .feed-list::-webkit-scrollbar-thumb{ background: var(--line); border-radius:2px; }

  .event{
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    animation: fadein .5s ease;
  }
  .event:last-child{ border-bottom:none; }
  @keyframes fadein{
    from{ opacity:0; transform: translateY(-4px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .event .time{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color: var(--ink-faint);
  }
  .event .text{
    font-size:12.5px;
    color: var(--ink);
    margin-top:3px;
    line-height:1.4;
  }
  .event .text b{ font-weight:600; }
  .event.pos .text{ color: #157a52; }
  .event.neg .text{ color: #b83338; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>VICULUS</h1>
    <p>Artificial Social Simulation</p>
  </div>
  <div class="status">
    <div class="pill"><span class="dot"></span> Simulation running</div>
    <div class="tick mono">TICK <span id="tickCount">000</span></div>
  </div>
</header>

<div class="stage">
  <div class="stage-label">Social Network</div>
  <svg id="netSvg" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div class="grid">
  <div class="cards" id="cardGrid"></div>

  <div class="feed">
    <h3>Recent Events</h3>
    <div class="feed-list" id="feedList"></div>
  </div>
</div>

<script>

const COLORS = ['#4F46E5', '#ff8a5c', '#1fa971', '#0ea5b0', '#a855c9'];

setInterval(loadState,1000);
let agents = [];
let edges = [];

const positions = {};

function calculatePositions(){

    const R = 150;
    const CX = 450;
    const CY = 210;

    agents.forEach((agent,i)=>{

        const angle =
            -Math.PI/2 +
            i*(2*Math.PI/agents.length);

        positions[agent.id]={
            x:CX+R*Math.cos(angle),
            y:CY+R*Math.sin(angle)
        };

    });

}


const sentimentColor = { pos:'#1fa971', neg:'#e5484d', neutral:'#c7c9d1' };

const eventTemplates = [
  { t:(a,b)=>`<b>${a}</b> helped <b>${b}</b>`, sentiment:'pos' },
  { t:(a,b)=>`<b>${a}</b> shared a story with <b>${b}</b>`, sentiment:'pos' },
  { t:(a,b)=>`<b>${a}</b> and <b>${b}</b> traded goods`, sentiment:'pos' },
  { t:(a,b)=>`<b>${a}</b> ignored <b>${b}</b>`, sentiment:'neg' },
  { t:(a,b)=>`<b>${a}</b> spread gossip about <b>${b}</b>`, sentiment:'neg' },
  { t:(a,b)=>`<b>${a}</b> wandered off alone`, sentiment:'neutral' },
  { t:(a,b)=>`<b>${a}</b> reflected quietly near the plaza`, sentiment:'neutral' },
];

const nameOf = id => agents.find(a=>a.id===id).name;

/* ---------------- render: network ---------------- */
function renderNetwork(){
  const svg = document.getElementById('netSvg');
  svg.innerHTML = '';

  const edgeGroup = document.createElementNS('http://www.w3.org/2000/svg','g');
  edges.forEach(e => {
    const p1 = positions[e.a], p2 = positions[e.b];
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
    line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
    line.setAttribute('class','edge');
    line.setAttribute('data-a', e.a);
    line.setAttribute('data-b', e.b);
    line.style.stroke = sentimentColor[e.sentiment];
    line.style.strokeWidth = (1 + e.strength*6).toFixed(1);
    line.style.opacity = (0.35 + e.strength*0.5).toFixed(2);
    edgeGroup.appendChild(line);
  });
  svg.appendChild(edgeGroup);

  const nodeGroup = document.createElementNS('http://www.w3.org/2000/svg','g');
  agents.forEach((a, i) => {
    const p = positions[a.id];
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('data-id', a.id);

    const ring = document.createElementNS('http://www.w3.org/2000/svg','circle');
    ring.setAttribute('cx', p.x); ring.setAttribute('cy', p.y); ring.setAttribute('r', 26);
    ring.setAttribute('class','ring'); ring.setAttribute('id', 'ring-'+a.id);
    g.appendChild(ring);

    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', p.x); circle.setAttribute('cy', p.y); circle.setAttribute('r', 22);
    circle.setAttribute('class','node'); circle.setAttribute('id','node-'+a.id);
    circle.style.fill = COLORS[i];
    circle.style.stroke = '#ffffff';
    g.appendChild(circle);

    const initial = document.createElementNS('http://www.w3.org/2000/svg','text');
    initial.setAttribute('x', p.x); initial.setAttribute('y', p.y+5);
    initial.setAttribute('text-anchor','middle');
    initial.setAttribute('font-family',"'Inter', sans-serif");
    initial.setAttribute('font-weight','700');
    initial.setAttribute('font-size','15');
    initial.setAttribute('fill', '#fff');
    initial.textContent = a.name[0];
    g.appendChild(initial);

    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x', p.x); label.setAttribute('y', p.y + 44);
    label.setAttribute('text-anchor','middle');
    label.setAttribute('class','node-label');
    label.textContent = a.name;
    g.appendChild(label);

    const role = document.createElementNS('http://www.w3.org/2000/svg','text');
    role.setAttribute('x', p.x); role.setAttribute('y', p.y + 58);
    role.setAttribute('text-anchor','middle');
    role.setAttribute('class','node-role');
    role.textContent = a.role.toUpperCase();
    g.appendChild(role);

    nodeGroup.appendChild(g);
  });
  svg.appendChild(nodeGroup);
}

function updateEdges(){
  edges.forEach(e => {
    const line = document.querySelector(`line[data-a="${e.a}"][data-b="${e.b}"]`);
    if(!line) return;
    line.style.stroke = sentimentColor[e.sentiment];
    line.style.strokeWidth = (1 + e.strength*6).toFixed(1);
    line.style.opacity = (0.35 + e.strength*0.5).toFixed(2);
  });
}

function pulseNode(id){
  const ring = document.getElementById('ring-'+id);
  const node = document.getElementById('node-'+id);
  if(!ring || !node) return;
  ring.classList.remove('pulse'); void ring.offsetWidth; ring.classList.add('pulse');
  node.classList.add('active');
  setTimeout(()=> node.classList.remove('active'), 1400);
}

/* ---------------- render: cards ---------------- */
function renderCards(){
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  agents.forEach((a, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-'+a.id;
    card.innerHTML = `
      <div class="card-top">
        <div class="avatar" style="background:${COLORS[i]}">${a.name[0]}</div>
        <div>
          <div class="card-name">${a.name}</div>
          <div class="card-role">${a.role}</div>
        </div>
      </div>
      <div class="goal-row">Goal &nbsp;<b>${a.goal}</b></div>

      <div class="stat">
        <div class="stat-head"><span>Energy</span><span class="val">${a.energy}</span></div>
        <div class="bar-track"><div class="bar-fill energy" style="width:${a.energy}%"></div></div>
      </div>
      <div class="stat">
        <div class="stat-head"><span>Belonging</span><span class="val">${100-a.belonging}</span></div>
        <div class="bar-track"><div class="bar-fill belonging" style="width:${100-a.belonging}%"></div></div>
      </div>
      <div class="stat">
        <div class="stat-head"><span>Reputation</span><span class="val">${a.reputation.toFixed(2)}</span></div>
        <div class="bar-track"><div class="bar-fill reputation" style="width:${a.reputation*100}%"></div></div>
      </div>

      <div class="action">
        <div class="label">Current Action</div>
        <div class="value">${a.action}</div>
      </div>
      <div class="memory">${a.memory}</div>
    `;
    grid.appendChild(card);
  });
}

function updateCards(){
  agents.forEach(a => {
    const belonging = 100 - a.belonging;
    const card = document.getElementById('card-'+a.id);
    card.querySelector('.stat:nth-child(2) .val').textContent = a.energy;
    card.querySelector('.stat:nth-child(2) .bar-fill').style.width = a.energy+'%';
    card.querySelector('.stat:nth-child(3) .val').textContent = belonging;
    card.querySelector('.stat:nth-child(3) .bar-fill').style.width = belonging+'%';
    card.querySelector('.stat:nth-child(4) .val').textContent = a.reputation.toFixed(2);
    card.querySelector('.stat:nth-child(4) .bar-fill').style.width = (a.reputation*100)+'%';
    card.querySelector('.action .value').textContent = a.action;
    card.querySelector('.memory').textContent = a.memory;
  });
}

function flashCard(id){
  const card = document.getElementById('card-'+id);
  card.classList.add('active');
  setTimeout(()=> card.classList.remove('active'), 1400);
}

/* ---------------- event feed ---------------- */
function pushEvent(html, sentiment){
  const list = document.getElementById('feedList');
  const now = new Date();
  const time = now.toTimeString().slice(0,8);
  const div = document.createElement('div');
  div.className = 'event ' + sentiment;
  div.innerHTML = `<div class="time mono">${time}</div><div class="text">${html}</div>`;
  list.insertBefore(div, list.firstChild);
  while(list.children.length > 24) list.removeChild(list.lastChild);
}
/* ---------------- initialize from Python ---------------- */
let initialized = false;

async function loadState() {
    
    const response = await fetch("/state");
    const simulation = await response.json();

    agents = simulation.agents;
    edges = simulation.relationships;

    calculatePositions();

    renderNetwork();
    renderCards();

    document.getElementById("tickCount").textContent =
        simulation.tick;

    const list = document.getElementById("feedList");
    list.innerHTML = "";

    simulation.events.forEach(event=>{
        pushEvent(event,"neutral");
    });

}

loadState();

setInterval(loadState,1000);
</script>

</body>
</html>
